<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8e1f26">
    <title>Offline | AAA Handyman Services</title>
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <style>
        :root { --navy: #1B2A4A; --crimson: #A61F2E; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--navy);
            color: #fff;
            text-align: center;
        }
        .card { max-width: 30rem; }
        img { width: 96px; height: 96px; border-radius: 50%; margin-bottom: 24px; }
        h1 { font-size: 1.6rem; margin: 0 0 12px; }
        p { font-size: 1rem; line-height: 1.6; opacity: 0.9; margin: 0 0 24px; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        a.btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
            background: var(--crimson);
            border: 2px solid var(--crimson);
        }
        button.btn {
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 700;
            color: #fff;
            background: transparent;
            border: 2px solid #fff;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icon.svg" alt="AAA Handyman Services logo">
        <h1>You're offline 🛠️</h1>
        <p>Looks like the internet took a coffee break! We can't load this page right now. Once you're back online, give it another try — we'll be right here.</p>
        <div class="actions">
            <button class="btn" onclick="location.reload()">Try again</button>
            <a class="btn" href="tel:+12483853432">Call (248) 385-3432</a>
        </div>
    </div>
</body>
</html>
