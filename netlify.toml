[build]
  publish = "public"
  command = "node scripts/build-css.mjs && node scripts/build-js.mjs && node scripts/update-static-pages.mjs && node scripts/build-service-pages.mjs && node scripts/build-city-pages.mjs && node scripts/build-icon-css.mjs && node scripts/build-chat-knowledge.mjs && node scripts/build-service-zones.mjs && node scripts/build-sitemap.mjs"

[build.environment]
  NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"

# ---------------------------------------------------------------------------
# Link checking
#
# netlify-plugin-checklinks is installed from the Netlify UI, which passes it no
# inputs. Declaring it here is how its inputs get set. On defaults it fails the
# build on four reports that are not broken links. The two filters below are not
# interchangeable -- which one applies depends on when the failure is knowable:
#
#   skipPatterns is matched before a check runs, against the report's operator,
#   name, expected and at fields. It cannot match an error message, because at
#   that point there is no error yet.
#
#   todoPatterns is matched after a check fails, so it can match the error text.
#   The check still runs and still prints, but counts as a TODO instead of a
#   failure, so it no longer fails the build.
#
# Skipped, being identifiable before the check runs:
#
#   fragment-redirect -- Every internal link here is extensionless
#   (/rates#materials), the same form the canonical tags and sitemap.xml use.
#   The plugin scans the built public/ directory, where only rates.html exists
#   on disk, so it reads the clean URL as a redirect and asks for
#   /rates.html#materials. Rewriting the 319 internal fragment links that way
#   would invert the site's URL strategy: Netlify serves /rates with a 200 and
#   301s /rates.html back to it, so every link would gain a redirect hop and
#   stop matching its own canonical URL. The anchors themselves are sound -- all
#   20 fragment targets resolve -- and a missing id still fails under its own
#   operator, which is not skipped here.
#
#   .netlify/images -- The Image CDN transform endpoint. Netlify answers it at
#   request time, so it has no file in public/ for a filesystem scan to open.
#   The images it resizes (icon.jpg, logo-banner.jpg, logo-circular.png) are all
#   present and get checked on their own.
#
#   public/services/index.html -- public/services is the directory of generated
#   service pages and public/services.html is the landing page, so the directory
#   shadows the clean URL when /services is resolved against the filesystem and
#   the plugin goes looking for an index file that should not exist. The
#   redirects are what actually serve this: /services returns services.html with
#   a 200, /services/ 301s to /services, and /services/* maps to
#   /services/:splat.html.
#
# Allowed to fail, being knowable only from the error text:
#
#   self-signed certificate -- The build container terminates TLS with its own
#   CA, so looking up an outside host fails certificate verification rather than
#   resolution. Scoped to that one message, so a host that has genuinely gone
#   away still fails the build with a DNS error.
# ---------------------------------------------------------------------------
[[plugins]]
  package = "netlify-plugin-checklinks"

  [plugins.inputs]
    skipPatterns = ["fragment-redirect", ".netlify/images", "public/services/index.html"]
    todoPatterns = ["self-signed certificate"]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com; manifest-src 'self'; worker-src 'self'; frame-src 'self' https://maps.google.com https://www.google.com https://www.google.com/recaptcha/ https://recaptcha.google.com/; frame-ancestors 'self' https://app.netlify.com https://create.netlify.com;"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The service worker controls every navigation, so a browser must never hold a
# stale copy -- otherwise a bad version would be pinned for its max-age. The
# browser directive below is what guarantees that. The edge needs no override:
# a deploy invalidates the edge copy on its own (see the caching note below).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------------
# Static caching policy
#
# Every response on this site comes from a file in public/, so it can only
# change when a deploy changes it -- and Netlify invalidates the whole edge
# cache for a deploy context on every deploy. That single fact decides the
# policy below, and it is why nothing here shortens the edge TTL.
#
# Two tiers, split by whether the URL changes when the bytes change:
#
#   Versioned assets -- stylesheets and scripts are always linked with a ?v=
#   stamp, and fonts, icons, and photography are added under a new name rather
#   than edited in place. A year of browser cache plus `immutable` is safe for
#   these, and it saves returning visitors a revalidation round trip per file
#   on a page that links a dozen of them.
#
#   Content -- pages, the JSON the quote calculator and service-area checker
#   fetch, the sitemap, and robots.txt all keep their URL across edits, so a
#   long browser max-age would pin stale content with no way to recall it.
#   These carry `max-age=0, must-revalidate`, which costs a browser
#   revalidation but keeps a price change one deploy away from every visitor.
#
# Note that `max-age=0` is a *browser* instruction. It is deliberately not
# mirrored into Netlify-CDN-Cache-Control: doing so makes the edge treat the
# object as stale on arrival and revalidate against the origin on every single
# request, which was measurably slower on the main document (a cold edge node
# had to fetch from origin before it could answer, and constant revalidation
# occasionally served the uncompressed variant of a 172 KB page). Left alone,
# the edge holds these files for its default year and a deploy clears them,
# so a content change still ships immediately without an origin round trip on
# the critical path.
#
# One caveat this relies on: nothing here may be edited in the backing store
# outside a deploy. Every file under public/ is either committed or generated
# by the build command, so that holds today.
#
# Header rules match the *request* path, not the path a rewrite resolves to.
# /rates is served from rates.html, but a rule for "/*.html" does not see it --
# the clean URL inherits Netlify's static-asset default instead, which is the
# identical `public, max-age=0, must-revalidate` set explicitly below. The
# rules here therefore pin the intent for the paths they name rather than
# changing behavior, and the clean URLs stay correct by default.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Generated service pages and city pages, addressed by their clean URLs.
[[headers]]
  for = "/services/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/handyman/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Site data read at runtime by the quote calculator and service-area checker.
# It is fetched without a version stamp, so it has to behave like content.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Crawler-facing files: a new service page should be discoverable on the next
# crawl, not after a day-long browser cache expires.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Font files use stable URLs and are committed alongside their matching CSS,
# so their cache entries remain immutable across repeat visits.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Installed-app icons, referenced from the web manifest.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Stylesheets and scripts are safe to pin for a year only because every <link>
# and <script> that points at them carries a ?v= stamp. Changing one of these
# files without bumping its stamp will strand returning visitors on the old
# copy for the full year.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Netlify Image CDN -- remote image allowlist
#
# The site does not transform any remote-hosted images: everything the Image
# CDN touches (the logo, hero banner, review photos streamed by
# /api/reviews/photo/:key) is served from this site. This section is kept as a
# documented anchor for the day a remote image host is added again.
# ---------------------------------------------------------------------------
[images]
  remote_images = []

