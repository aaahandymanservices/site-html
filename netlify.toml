[build]
  publish = "public"
  command = "node scripts/build-css.mjs && node scripts/build-js.mjs && node scripts/update-static-pages.mjs && node scripts/build-service-pages.mjs && node scripts/build-city-pages.mjs && node scripts/build-icon-css.mjs && node scripts/build-chat-knowledge.mjs && node scripts/build-service-zones.mjs && node scripts/build-sitemap.mjs"

[build.environment]
  NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"

# ---------------------------------------------------------------------------
# Link checking
#
# netlify-plugin-checklinks is installed from the Netlify UI, which passes it no
# inputs. Declaring it here is how its inputs get set. On defaults it fails the
# build on four reports that are not broken links. The two filters below are not
# interchangeable -- which one applies depends on when the failure is knowable:
#
#   skipPatterns is matched before a check runs, against the report's operator,
#   name, expected and at fields. It cannot match an error message, because at
#   that point there is no error yet.
#
#   todoPatterns is matched after a check fails, so it can match the error text.
#   The check still runs and still prints, but counts as a TODO instead of a
#   failure, so it no longer fails the build.
#
# Skipped, being identifiable before the check runs:
#
#   fragment-redirect -- Every internal link here is extensionless
#   (/rates#materials), the same form the canonical tags and sitemap.xml use.
#   The plugin scans the built public/ directory, where only rates.html exists
#   on disk, so it reads the clean URL as a redirect and asks for
#   /rates.html#materials. Rewriting the 319 internal fragment links that way
#   would invert the site's URL strategy: Netlify serves /rates with a 200 and
#   301s /rates.html back to it, so every link would gain a redirect hop and
#   stop matching its own canonical URL. The anchors themselves are sound -- all
#   20 fragment targets resolve -- and a missing id still fails under its own
#   operator, which is not skipped here.
#
#   .netlify/images -- The Image CDN transform endpoint. Netlify answers it at
#   request time, so it has no file in public/ for a filesystem scan to open.
#   The images it resizes (icon.jpg, logo-banner.jpg, logo-circular.png) are all
#   present and get checked on their own.
#
#   public/services/index.html -- public/services is the directory of generated
#   service pages and public/services.html is the landing page, so the directory
#   shadows the clean URL when /services is resolved against the filesystem and
#   the plugin goes looking for an index file that should not exist. The
#   redirects are what actually serve this: /services returns services.html with
#   a 200, /services/ 301s to /services, and /services/* maps to
#   /services/:splat.html.
#
# Allowed to fail, being knowable only from the error text:
#
#   self-signed certificate -- The build container terminates TLS with its own
#   CA, so looking up an outside host fails certificate verification rather than
#   resolution. Scoped to that one message, so a host that has genuinely gone
#   away still fails the build with a DNS error.
# ---------------------------------------------------------------------------
[[plugins]]
  package = "netlify-plugin-checklinks"

  [plugins.inputs]
    skipPatterns = ["fragment-redirect", ".netlify/images", "public/services/index.html"]
    todoPatterns = ["self-signed certificate"]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com; manifest-src 'self'; worker-src 'self'; frame-src 'self' https://maps.google.com https://www.google.com; frame-ancestors 'self' https://app.netlify.com https://create.netlify.com;"

# The service worker controls every navigation, so it must never be served from
# a stale cache -- otherwise a bad version would be pinned for its max-age.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------------
# Static caching policy
#
# Everything below sorts into one of two tiers, decided by a single question:
# does the URL change when the bytes change?
#
#   Versioned assets -- stylesheets and scripts are always linked with a ?v=
#   stamp, and fonts, icons, and photography are added under a new name rather
#   than edited in place. A year of browser cache plus `immutable` is safe for
#   these, and it saves returning visitors a revalidation round trip per file
#   on a page that links a dozen of them. The CDN is given the same year so
#   repeat traffic is answered at the edge instead of from the origin.
#
#   Content -- pages, the JSON the quote calculator and service-area checker
#   fetch, the sitemap, and robots.txt all keep their URL across edits, so a
#   long max-age would pin stale content in browsers with no way to recall it.
#   These revalidate with the origin every time while the CDN answers straight
#   from cache and refreshes in the background, which keeps the response fast
#   without delaying a price change or a new service area.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# Site data read at runtime by the quote calculator and service-area checker.
# It is fetched without a version stamp, so it has to behave like content.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# Crawler-facing files: a new service page should be discoverable on the next
# crawl, not after a day-long browser cache expires.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Font files use stable URLs and are committed alongside their matching CSS,
# so their cache entries remain immutable across repeat visits.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Installed-app icons, referenced from the web manifest.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Stylesheets and scripts are safe to pin for a year only because every <link>
# and <script> that points at them carries a ?v= stamp. Changing one of these
# files without bumping its stamp will strand returning visitors on the old
# copy for the full year.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"
