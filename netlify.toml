[build]
  publish = "public"
  command = "node scripts/build-js.mjs && node scripts/build-service-pages.mjs && node scripts/build-city-pages.mjs && node scripts/update-static-pages.mjs && node scripts/build-css.mjs && node scripts/build-icon-css.mjs && node scripts/build-chat-knowledge.mjs && node scripts/build-service-zones.mjs && node scripts/build-sitemap.mjs"

[build.environment]
  NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"

# ---------------------------------------------------------------------------
# Lighthouse
#
# The plugin is installed from the Netlify UI (see .netlify/plugins), which
# passes it no inputs. Declaring it here is how its inputs get set, and
# without these inputs it runs on its defaults -- which cannot produce a
# score on this site at all:
#
#   On defaults the plugin registers onSuccess and audits process.env
#   DEPLOY_URL. Every deploy-specific hostname for this site answers the
#   edge's plain "Not Found": the site's deploy_url (main.aaahandyman.services,
#   which is also every production deploy's deploy_ssl_url), the
#   <branch>.aaahandyman.services branch hosts, and the deploy permalinks.
#   Only the canonical https://aaahandyman.services and the
#   aaahandymanservicesllc.netlify.app default domain serve the site. So the
#   audit aborted with "Lighthouse was unable to reliably load the page you
#   requested... (Status code: 404)" and no deploy recorded any scores.
#
# Pointing the audit at the canonical URL is not enough on its own, because
# in onSuccess mode the plugin overwrites each audit's url with DEPLOY_URL
# (get-configuration/index.js forces `url: deployUrl` whenever a deploy URL is
# present). The audit url below is only honoured on the onPostBuild event, and
# fail_deploy_on_score_thresholds is the plugin's only switch for that event --
# hence its use here. Scores are then recorded on every build, before deploy.
#
# Auditing the live site instead of the local static copy. onPostBuild would
# otherwise serve public/ over a bare Express static server, and that server
# can only answer files. Two things the home page needs are not files:
# /api/reviews, which home.js fetches on idle to populate the review cards,
# and the response headers themselves -- above all the Content-Security-Policy
# set below, which express.static never sends. On the local server that fetch
# answered 404 and landed in the browser console (failing errors-in-console)
# and the report read "No CSP found in enforcement mode", even though the
# production origin answers the fetch with a 200 and serves the policy on
# every response. Naming an absolute url makes the plugin skip the local
# server entirely (get-server returns a stub whose url is this one), so the
# platform routes and headers are exercised exactly as visitors see them.
# public/ is still built first, so a genuinely broken build still fails before
# the audit runs.
#
# This MUST stay an array of tables ([[...]], not [...]). The plugin gates the
# whole input on Array.isArray and silently discards a plain table, falling
# back to serving public/ locally -- which is how the phantom 404s and the
# missing-CSP finding got into an earlier report.
#
# Thresholds sit generously below the numbers this site records (performance
# 92-95, accessibility 98-100, best-practices 92, SEO 100, PWA 100) so the
# audit acts as a tripwire for a genuinely broken build rather than a gate on
# audit noise. Best practices carries the most headroom because the audited
# page loads third-party Google scripts (reCAPTCHA on the quote form, the
# analytics tag) whose own console output this site cannot suppress, and
# errors-in-console is scored under that category.
#
# Performance carries the widest margin for the same reason: the audit runs
# against the live canonical URL under simulated mobile CPU throttling, where
# the deferred third-party tags (the analytics loader scheduled 5s after idle
# and the reCAPTCHA scripts it can pull in) register as long tasks and depress
# Total Blocking Time and Time to Interactive even though every paint metric
# this site controls (FCP, LCP, Speed Index) scores at or above 0.97. An audit
# run on 2026-09-04 measured exactly that split -- FCP 0.97, LCP 0.98,
# Speed Index 0.97, but TBT 0.49 and TTI 0.48, category 0.78 -- on a build
# whose own pages were unchanged. A build that genuinely breaks still collapses
# every metric to near zero, so 0.75 keeps the tripwire while ignoring that
# third-party noise.
# ---------------------------------------------------------------------------
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    fail_deploy_on_score_thresholds = "true"

  [[plugins.inputs.audits]]
    url = "https://aaahandyman.services"

  [plugins.inputs.thresholds]
    performance = 0.75
    accessibility = 0.9
    best-practices = 0.8
    seo = 0.9
    pwa = 0.85

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com; manifest-src 'self'; worker-src 'self'; frame-src 'self' https://maps.google.com https://www.google.com https://www.google.com/recaptcha/ https://recaptcha.google.com/ https://calendar.google.com; frame-ancestors 'self' https://app.netlify.com https://create.netlify.com; upgrade-insecure-requests;"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The service worker controls every navigation, so a browser must never hold a
# stale copy -- otherwise a bad version would be pinned for its max-age. The
# browser directive below is what guarantees that. The edge needs no override:
# a deploy invalidates the edge copy on its own (see the caching note below).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------------
# Static caching policy
#
# Every response on this site comes from a file in public/, so it can only
# change when a deploy changes it -- and Netlify invalidates the whole edge
# cache for a deploy context on every deploy. That single fact decides the
# policy below, and it is why nothing here shortens the edge TTL.
#
# Two tiers, split by whether the URL changes when the bytes change:
#
#   Versioned assets -- stylesheets and scripts are always linked with a ?v=
#   stamp, and fonts, icons, and photography are added under a new name rather
#   than edited in place. A year of browser cache plus `immutable` is safe for
#   these, and it saves returning visitors a revalidation round trip per file
#   on a page that links a dozen of them.
#
#   Content -- pages, the JSON the quote calculator and service-area checker
#   fetch, the sitemap, and robots.txt all keep their URL across edits, so a
#   long browser max-age would pin stale content with no way to recall it.
#   These carry `max-age=0, must-revalidate`, which costs a browser
#   revalidation but keeps a price change one deploy away from every visitor.
#
# Note that `max-age=0` is a *browser* instruction. It is deliberately not
# mirrored into Netlify-CDN-Cache-Control: doing so makes the edge treat the
# object as stale on arrival and revalidate against the origin on every single
# request, which was measurably slower on the main document (a cold edge node
# had to fetch from origin before it could answer, and constant revalidation
# occasionally served the uncompressed variant of a 172 KB page). Left alone,
# the edge holds these files for its default year and a deploy clears them,
# so a content change still ships immediately without an origin round trip on
# the critical path.
#
# One caveat this relies on: nothing here may be edited in the backing store
# outside a deploy. Every file under public/ is either committed or generated
# by the build command, so that holds today.
#
# Header rules match the *request* path, not the path a rewrite resolves to.
# /rates is served from rates.html, but a rule for "/*.html" does not see it --
# the clean URL inherits Netlify's static-asset default instead, which is the
# identical `public, max-age=0, must-revalidate` set explicitly below. The
# rules here therefore pin the intent for the paths they name rather than
# changing behavior, and the clean URLs stay correct by default.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Generated service pages and city pages, addressed by their clean URLs.
[[headers]]
  for = "/services/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/handyman/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Site data read at runtime by the quote calculator and service-area checker.
# It is fetched without a version stamp, so it has to behave like content.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Crawler-facing files: a new service page should be discoverable on the next
# crawl, not after a day-long browser cache expires.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Font files use stable URLs and are committed alongside their matching CSS,
# so their cache entries remain immutable across repeat visits.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Installed-app icons, referenced from the web manifest.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Stylesheets and scripts are safe to pin for a year only because every <link>
# and <script> that points at them carries a ?v= stamp. Changing one of these
# files without bumping its stamp will strand returning visitors on the old
# copy for the full year.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Netlify Image CDN -- remote image allowlist
#
# The site does not transform any remote-hosted images: everything the Image
# CDN touches (the logo, hero banner, review photos streamed by
# /api/reviews/photo/:key) is served from this site. This section is kept as a
# documented anchor for the day a remote image host is added again.
# ---------------------------------------------------------------------------
[images]
  remote_images = []
